<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>OmniProxy — Purple Rocket — MD3 Expressive Banner</title>
<desc>MD3 Expressive banner: purple gateway with rocket launching — universal proxy for OpenAI/Anthropic/Gemini/Ollama</desc>
<defs>
  <linearGradient id="pu" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7C4DFF"/>
    <stop offset="48%" stop-color="#6B4EFF"/>
    <stop offset="100%" stop-color="#4A1D96"/>
  </linearGradient>
  <linearGradient id="pu2" x1="100%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E1BEE7"/>
    <stop offset="50%" stop-color="#CE93D8"/>
    <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pu3" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#B388FF" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFD600"/>
    <stop offset="35%" stop-color="#FF9100"/>
    <stop offset="75%" stop-color="#FF3D00"/>
    <stop offset="100%" stop-color="#4A1D96" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="38%">
    <stop offset="0%" stop-color="#B388FF" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="0.6" fill="white" opacity="0.05"/>
  </pattern>
</defs>
<rect width="1280" height="640" rx="32" fill="#FFFBFE"/>
<rect width="1280" height="640" rx="32" fill="url(#pu)" opacity="0.035"/>
<!-- Large purple expressive blobs -->
<path d="M -120 360 C -120 140 60 40 320 80 C 580 120 680 240 640 420 C 600 600 420 700 180 640 C -20 590 -120 480 -120 360 Z" fill="url(#pu)" opacity="1"/>
<ellipse cx="260" cy="218" rx="216" ry="138" fill="url(#pu2)" opacity="0.92"/>
<path d="M 760 520 C 840 420 1020 360 1150 420 C 1240 480 1280 560 1260 620 L 780 640 Z" fill="url(#pu3)" opacity="0.9"/>
<!-- Accent stars — purple expressive -->
<circle cx="1184" cy="96" r="16" fill="#7C4DFF" opacity="0.95"/>
<circle cx="1122" cy="74" r="8" fill="#E1BEE7" opacity="0.95"/>
<circle cx="104" cy="524" r="12" fill="#B388FF" opacity="0.85"/>
<rect width="1280" height="640" rx="32" fill="url(#grain)" opacity="0.32" style="mix-blend-mode:soft-light"/>
<!-- LEFT: Wordmark -->
<g transform="translate(64 0)">
  <g transform="translate(0 72)">
    <rect x="0" y="0" width="212" height="28" rx="14" fill="#1C1B1F"/>
    <text x="106" y="19.5" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.14em" fill="white">UNIVERSAL GATEWAY</text>
  </g>
  <text x="0" y="232" font-family="system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif" font-size="112" font-weight="900" letter-spacing="-0.045em" fill="#1C1B1F">Omni<tspan fill="url(#pu)">Proxy</tspan></text>
  <text x="0" y="292" font-family="system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.02em" fill="#1C1B1F" opacity="0.84">OpenAI / Anthropic / Gemini / Ollama — one gateway.</text>
  <text x="0" y="322" font-family="system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.02em" fill="#1C1B1F" opacity="0.84">Provider <tspan font-weight="700">web interfaces</tspan>, not paid APIs.</text>
  <rect x="0" y="354" width="84" height="4" rx="2" fill="url(#pu)"/>
  <g transform="translate(0 384)" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.02em">
    <rect x="0" y="0" width="118" height="30" rx="15" fill="white" stroke="#1C1B1F" stroke-opacity="0.10"/>
    <text x="59" y="19" text-anchor="middle" fill="#1C1B1F">4 dialects</text>
    <rect x="128" y="0" width="164" height="30" rx="15" fill="white" stroke="#1C1B1F" stroke-opacity="0.10"/>
    <text x="210" y="19" text-anchor="middle" fill="#1C1B1F">pluggable → your own</text>
    <rect x="302" y="0" width="118" height="30" rx="15" fill="#1C1B1F"/>
    <text x="361" y="19" text-anchor="middle" fill="white">0600 store</text>
  </g>
  <g transform="translate(0 424)" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.02em">
    <rect x="0" y="0" width="138" height="30" rx="15" fill="#1C1B1F"/>
    <text x="69" y="19" text-anchor="middle" fill="white">text • image • video</text>
    <rect x="148" y="0" width="148" height="30" rx="15" fill="white" stroke="#1C1B1F" stroke-opacity="0.10"/>
    <text x="222" y="19" text-anchor="middle" fill="#1C1B1F">1 → N accounts</text>
  </g>
  <text x="0" y="512" font-family="ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.04em" fill="#1C1B1F" opacity="0.38">pnpm · turbo · zod · vitest · tsc · 885 tests · v0.1.4 · shirou-eh/OmniProxy</text>
</g>
<!-- RIGHT: Purple rocket launching through gateway portal -->
<g transform="translate(1020 310)">
  <ellipse cx="0" cy="38" rx="176" ry="152" fill="url(#glow)" opacity="0.95" filter="url(#soft)"/>
  <!-- Card — white squircle -->
  <g filter="url(#soft)">
    <rect x="-148" y="-168" width="296" height="296" rx="64" fill="white"/>
  </g>
  <rect x="-148" y="-168" width="296" height="296" rx="64" fill="white" stroke="#1C1B1F" stroke-opacity="0.06"/>
  <!-- Inner portal — deep purple -->
  <rect x="-84" y="-112" width="168" height="200" rx="42" fill="#1C1B1F"/>
  <rect x="-66" y="-94" width="132" height="164" rx="30" fill="none" stroke="url(#pu)" stroke-width="3.5" opacity="0.96"/>
  <rect x="-66" y="-94" width="132" height="36" rx="30" fill="white" opacity="0.05"/>
  <!-- Rocket inside portal — slightly angled -->
  <g transform="translate(0 -6) rotate(-10)">
    <!-- Flame -->
    <path d="M -18 62 C -21 76 -17 92 0 108 C 17 92 21 76 18 62 Z" fill="url(#flame)" opacity="0.96"/>
    <path d="M -10 62 C -12 71 -9 82 0 86 C 9 82 12 71 10 62 Z" fill="white" opacity="0.92"/>
    <!-- Body -->
    <rect x="-30" y="-72" width="60" height="118" rx="30" fill="white"/>
    <path d="M -30 -54 C -30 -70 -17 -88 0 -88 C 17 -88 30 -70 30 -54 L -30 -54 Z" fill="url(#pu)"/>
    <!-- Window -->
    <circle cx="0" cy="-30" r="20" fill="#1C1B1F"/>
    <circle cx="0" cy="-30" r="16.5" fill="#E1BEE7"/>
    <circle cx="0" cy="-30" r="16.5" fill="url(#pu)" opacity="0.85"/>
    <circle cx="-5.5" cy="-34.5" r="4.8" fill="white" opacity="0.88"/>
    <circle cx="0" cy="-30" r="7" fill="white"/>
    <!-- Fins -->
    <path d="M -30 18 C -46 18 -58 28 -58 44 L -30 44 Z" fill="#4A1D96"/>
    <path d="M 30 18 C 46 18 58 28 58 44 L 30 44 Z" fill="#4A1D96"/>
    <!-- Stripe -->
    <rect x="-30" y="4" width="60" height="12" rx="6" fill="url(#pu)"/>
  </g>
  <!-- Small stars around portal -->
  <g fill="#7C4DFF" opacity="0.9">
    <circle cx="-118" cy="-132" r="3.5"/>
    <circle cx="118" cy="-128" r="2.8"/>
    <circle cx="-108" cy="132" r="2.5"/>
  </g>
  <text x="0" y="192" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="0.14em" fill="#1C1B1F" opacity="0.52">ONE LOOP • FOUR DIALECTS • ONE ROCKET</text>
</g>
</svg>
